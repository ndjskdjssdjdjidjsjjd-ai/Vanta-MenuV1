name: Build VantaMenuV1

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Win64
            os: windows-latest
          - target: Android64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: ${{ matrix.target }}
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main
      - name: Upload .geode package
        uses: actions/upload-artifact@v7
        with:
          name: VantaMenuV1
          path: ${{ steps.combine.outputs.build-output }}
